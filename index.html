  .ad-flash{position:fixed;left:0;right:0;bottom:0;z-index:9998;padding:14px;text-align:center;

  @keyframes adflash{0%{background:#ff0080}100%{background:#00e5ff;color:#000}}
  .ad-move{position:fixed;z-index:9997;padding:10px 14px;background:#ffeb3b;color:#d50000;
    border:3px dashed #d50000;font:bold 16px Arial,sans-serif;cursor:pointer}
  .ad-pop{position:fixed;z-index:9999;width:min(300px,80vw);padding:18px;background:#fff;color:#000;
    border:4px solid #00c853;box-shadow:6px 6px 0 #000;text-align:center;font:bold 18px Arial,sans-serif}
  .ad-pop button{margin-top:12px;padding:8px 14px;font-size:15px;cursor:pointer}

<div class="ad-flash">🔥 HOT SINGLES IN YOUR AREA ARE LOOKING AT THIS WEBSITE 🔥</div>
<div class="ad-move" id="adMove">⚠️ YOUR COMPUTER HAS 7 VIRUSES ⚠️</div>

<script>
(function () {
  var W = function(){return window.innerWidth}, H = function(){return window.innerHeight};
  var rand = function(n){return Math.floor(Math.random()*n)};

  // banner bouncing thing
  var m = document.getElementById('adMove'), x = 20, y = 80, dx = 3, dy = 2;
  setInterval(function () {
    x += dx; y += dy;
    if (x < 0 || x + m.offsetWidth > W())  dx = -dx;
    if (y < 0 || y + m.offsetHeight > H()) dy = -dy;
    m.style.left = x + 'px'; m.style.top = y + 'px';
  }, 16);
  m.onclick = function(){ alert('You clicked an ad. Congratulations. Nothing happened.'); };

  // 2) fake u won thing
  var count = 0;
  function popup() {
    var p = document.createElement('div');
    p.className = 'ad-pop';
    p.style.left = rand(Math.max(W() - 320, 10)) + 'px';
    p.style.top  = rand(Math.max(H() - 220, 10)) + 'px';
    p.innerHTML = '🎉 YOU ARE VISITOR #1,000,000! 🎉<br>Claim your FREE prize!' +
                  '<br><button class="claim">CLAIM NOW</button>' +
                  '<button class="ad-x" title="close">x</button>';
    var x = p.querySelector('.ad-x');

    // tiny close button dodges the cursor
    x.onmouseover = function () {
      p.style.left = rand(Math.max(W() - 320, 10)) + 'px';
      p.style.top  = rand(Math.max(H() - 220, 10)) + 'px';
    };
    // if they do manage to close it, two more appear
    x.onclick = function () { p.remove(); popup(); popup(); };
    p.querySelector('.claim').onclick = function () {
      alert('Prize: bakos photos :flushed:'); popup();
    };
    document.body.appendChild(p);
    count++;
  }

  // first popup after 2s, then a new one every 8s (max 8 so it doesn't crash anyone's browser)
  setTimeout(popup, 2000);
  setInterval(function(){ if (document.querySelectorAll('.ad-pop').length < 8) popup(); }, 1000);
})();
</script>
